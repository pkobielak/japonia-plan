<script>
(function(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function(){});
  var ITER=300000, KEY='planPass';
  var raw=Uint8Array.from(atob(document.getElementById('enc').textContent.trim()),function(c){return c.charCodeAt(0)});
  var f=document.getElementById('f'), p=document.getElementById('p'), r=document.getElementById('r'), b=document.getElementById('b'), e=document.getElementById('e');
  var HEAD='<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"><link rel="icon" href="./icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Japonia"><meta name="theme-color" content="#FBF7EC">';
  async function decrypt(pass){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:raw.slice(0,16),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},key,raw.slice(28));
    return new TextDecoder().decode(pt);
  }
  function show(html){
    html=html.replace(/<head>/i,'<head>'+HEAD);
    document.open(); document.write(html); document.close();
  }
  async function tryPass(pass, remember){
    b.disabled=true; e.textContent='odszyfrowuję…';
    try{
      var html=await decrypt(pass);
      if(remember){ try{ localStorage.setItem(KEY,pass); }catch(x){} }
      show(html);
    }catch(x){
      try{ localStorage.removeItem(KEY); }catch(y){}
      e.textContent = (window.isSecureContext===false) ? 'Przeglądarka blokuje szyfrowanie poza HTTPS.' : 'Złe hasło.';
      b.disabled=false; p.value=''; p.focus();
    }
  }
  f.addEventListener('submit',function(ev){ ev.preventDefault(); if(p.value) tryPass(p.value, r.checked); });
  var saved=null; try{ saved=localStorage.getItem(KEY); }catch(x){}
  if(saved) tryPass(saved, true);
})();
</script>
